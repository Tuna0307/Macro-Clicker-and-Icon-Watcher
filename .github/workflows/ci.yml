name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff lint
        run: python -m ruff check .

      # Formatting is useful feedback for AI-assisted changes, but a style-only
      # difference should not fail the quality job or hide later correctness checks.
      - name: Check Ruff formatting (informational)
        continue-on-error: true
        run: python -m ruff format --check .

      # Type checking is valuable maintenance feedback, but the current project
      # contains mature working automation where annotation-only issues should
      # not turn an otherwise passing runtime/test build red.
      - name: Run mypy (informational)
        continue-on-error: true
        run: python -m mypy macro_clicker tools

      - name: Validate scenarios and templates
        run: python -m tools.validate_scenarios
